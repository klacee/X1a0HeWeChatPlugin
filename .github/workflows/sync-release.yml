name: 同步上游全部Release与附件
on:
  workflow_dispatch:  # 支持手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 同步所有Release+附件
        uses: gautamkrishnar/github-repo-sync-action@master
        with:
          source_repo: X1a0He/X1a0HeWeChatPlugin
          target_repo: klacee/X1a0HeWeChatPlugin
          github_token: ${{ secrets.UPSTREAM_TOKEN }}
          sync_tags: true
          sync_releases: true
