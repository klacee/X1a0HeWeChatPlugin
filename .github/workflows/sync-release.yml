name: 完整同步上游所有内容（分支+Tag+Release+附件）
on:
  workflow_dispatch:  # 手动一键运行

jobs:
  sync_releases:
    runs-on: ubuntu-latest
    steps:
      - name: 全量同步上游仓库
        uses: repo-sync/github-sync@v2
        with:
          source_repo: X1a0He/X1a0HeWeChatPlugin
          target_repo: klacee/X1a0HeWeChatPlugin
          github_token: ${{ secrets.UPSTREAM_TOKEN }}
          sync_branches: true    # 开启：同步所有代码分支
          sync_tags: true        # 开启：同步所有版本标签
          sync_releases: true    # 开启：同步所有Release+二进制附件
