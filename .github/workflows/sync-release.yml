name: Sync Releases from Upstream

on:
  workflow_dispatch:      # 手动触发
    inputs:
      upstream_repo:
        description: 'X1a0He/X1a0HeWeChatPlugin'
        required: true
        default: 'X1a0He/X1a0HeWeChatPlugin'
  schedule:
    - cron: '0 3 * * *'   # 可选：每天凌晨3点自动同步一次

permissions:
  contents: write         # 需要写权限才能创建 release

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Sync tags from upstream
        run: |
          UPSTREAM="${{ github.event.inputs.upstream_repo || 'X1a0He/X1a0HeWeChatPlugin' }}"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --tags
          git push origin --tags

      - name: Sync releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM="${{ github.event.inputs.upstream_repo || 'X1a0He/X1a0HeWeChatPlugin' }}"
          TARGET="${{ github.repository }}"

          tags=$(gh release list --repo "$UPSTREAM" --limit 1000 | awk '{print $NF}')

          for tag in $tags; do
            echo "==> 处理 release: $tag"

            # 如果目标仓库已存在同名 release，跳过
            if gh release view "$tag" --repo "$TARGET" >/dev/null 2>&1; then
              echo "已存在，跳过：$tag"
              continue
            fi

            mkdir -p "./assets/$tag"
            gh release download "$tag" --repo "$UPSTREAM" -D "./assets/$tag" || echo "没有资源文件"

            title=$(gh release view "$tag" --repo "$UPSTREAM" --json name -q '.name')
            gh release view "$tag" --repo "$UPSTREAM" --json body -q '.body' > "./assets/$tag/notes.md"

            files=$(find "./assets/$tag" -type f ! -name "notes.md")

            gh release create "$tag" \
              --repo "$TARGET" \
              --title "$title" \
              --notes-file "./assets/$tag/notes.md" \
              $files
          done
